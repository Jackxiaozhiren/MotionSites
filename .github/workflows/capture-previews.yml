name: Capture Real Project Previews
on:
  pull_request:
    paths:
      - 'scripts/capture_previews.mjs'
      - 'projects/jack-3d-creator/**'
      - 'projects/prisma-creative-studio/**'
      - 'projects/axion-studio/**'
      - 'projects/wanderful/**'
      - 'projects/foundation-new-digital-epoch/**'
      - '.github/workflows/capture-previews.yml'
  workflow_dispatch:
concurrency:
  group: captures-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build and capture real projects
        run: node scripts/capture_previews.mjs
      - name: Save screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-project-previews
          path: |
            site/previews/
          if-no-files-found: warn
