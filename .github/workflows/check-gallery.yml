name: Check Gallery
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/check_gallery.py', 'scripts/check_project_paths.py', 'scripts/*.mjs', 'projects/**', '.github/workflows/check-gallery.yml']
  pull_request:
    paths: ['site/**', 'scripts/check_gallery.py', 'scripts/check_project_paths.py', 'projects/**', '.github/workflows/check-gallery.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate gallery
        run: python3 scripts/check_gallery.py
      - name: Generate and validate source-backed articles
        run: |
          python3 scripts/build_editorial_pages.py
          python3 scripts/build_editorial_pages.py --check
      - name: Validate descriptive project directories
        run: python3 scripts/check_project_paths.py
      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/project.js
          node --check scripts/smoke_gallery.mjs
          node --check scripts/check_live_gallery.mjs
          node --check scripts/audit_accessibility.mjs
          node --check scripts/summarize_lighthouse.mjs
          node --check scripts/render_social_card.mjs
          node --check scripts/capture_previews.mjs
