name: Publish MotionSites Gallery
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'projects/jack-3d-creator/**'
      - 'projects/prisma-creative-studio/**'
      - 'projects/axion-studio/**'
      - 'projects/wanderful/**'
      - 'projects/foundation-new-digital-epoch/**'
      - 'scripts/capture_previews.mjs'
      - 'scripts/render_social_card.mjs'
      - 'scripts/check_live_gallery.mjs'
      - 'scripts/build_editorial_pages.py'
      - 'assets/motionsites-social-card.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser for screenshots and share artwork
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render original social preview artwork
        run: node scripts/render_social_card.mjs site/assets/social-preview.jpg
      - name: Capture verified live demos and screenshots
        continue-on-error: true
        run: node scripts/capture_previews.mjs
      - name: Generate five indexable source-backed articles
        run: python3 scripts/build_editorial_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify publicly deployed gallery and guides
        env:
          MOTIONSITES_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check_live_gallery.mjs
