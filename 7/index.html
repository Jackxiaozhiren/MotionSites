<script type="text/babel">
(function() {
const { motion: m } = Motion;
const FADE_MS = 500;
const FADE_OUT_LEAD = 0.55;

function FadingVideo({ src, className, style }) {
  const videoRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const fadingOutRef = React.useRef(false);
  const mountedRef = React.useRef(true);

  const fadeTo = React.useCallback((target, dur) => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    const video = videoRef.current;
    if (!video) return;
    const start = performance.now();
    const from = parseFloat(video.style.opacity) || 0;

    function step(now) {
      if (!mountedRef.current || !video) return;
      const elapsed = now - start;
      const p = Math.min(elapsed / dur, 1);
      const eased = 1 - (1 - p) * (1 - p);
      video.style.opacity = from + (target - from) * eased;
      if (p < 1) {
        rafRef.current = requestAnimationFrame(step);
      } else {
        video.style.opacity = target;
        rafRef.current = null;
      }
    }
    rafRef.current = requestAnimationFrame(step);
  }, []);

  React.useEffect(() => {
    const video = videoRef.current;
    if (!video) return;
    let cancelled = false;

    const onLoadedData = () => {
      if (cancelled) return;
      video.style.opacity = 0;
      video.play().catch(() => {});
      fadeTo(1, FADE_MS);
    };

    const onTimeUpdate = () => {
      if (fadingOutRef.current) return;
      const remaining = video.duration - video.currentTime;
      if (remaining <= FADE_OUT_LEAD && remaining > 0) {
        fadingOutRef.current = true;
        fadeTo(0, FADE_MS);
      }
    };

    const onEnded = () => {
      video.style.opacity = 0;
      setTimeout(() => {
        if (cancelled) return;
        video.currentTime = 0;
        video.play().catch(() => {});
        fadingOutRef.current = false;
        fadeTo(1, FADE_MS);
      }, 100);
    };

    video.addEventListener('loadeddata', onLoadedData);
    video.addEventListener('timeupdate', onTimeUpdate);
    video.addEventListener('ended', onEnded);

    return () => {
      cancelled = true;
      mountedRef.current = false;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      video.removeEventListener('loadeddata', onLoadedData);
      video.removeEventListener('timeupdate', onTimeUpdate);
      video.removeEventListener('ended', onEnded);
    };
  }, [fadeTo]);

  return (
    <video
      ref={videoRef}
      autoPlay muted playsInline preload="auto"
      className={className}
      style={{ opacity: 0, ...style }}
    >
      <source src={src} type="video/mp4" />
    </video>
  );
}

window.FadingVideo = FadingVideo;
})();
</script>

<script type="text/babel">
(function() {
const { motion: m } = Motion;

function BlurText({ text, className }) {
  const [isVisible, setIsVisible] = React.useState(false);
  const ref = React.useRef(null);

  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const observer = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setIsVisible(true); observer.disconnect(); } },
      { threshold: 0.1 }
    );
    observer.observe(el);
    return () => observer.disconnect();
  }, []);

  return (
    <p ref={ref} className={className} style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}>
      {text.split(' ').map((word, i) => (
        <m.span
          key={i}
          style={{ display: 'inline-block', marginRight: '0.28em' }}
          initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
          animate={isVisible ? {
            filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
            opacity: [0, 0.5, 1],
            y: [50, -5, 0],
          } : {}}
          transition={{
            duration: 0.7, times: [0, 0.5, 1], ease: 'easeOut',
            delay: (i * 100) / 1000,
          }}
        >
          {word}
        </m.span>
      ))}
    </p>
  );
}

window.BlurText = BlurText;
})();
</script>
